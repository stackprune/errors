version: "2"
linters:
  default: all
  disable:
    - gomodguard
    - wsl
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/stackprune/errors
            - github.com/stretchr/testify/assert
            - github.com/stretchr/testify/require
    varnamelen:
      ignore-names:
        - tt
  exclusions:
    rules:
      - linters:
          - err113
          - exhaustruct
          - funlen
        path: _test\.go
formatters:
  enable:
    - gci
    - golines
